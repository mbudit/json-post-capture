services:
  json-post-capture:
    build: .
    container_name: json-post-capture
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/captures.db
      CAPTURE_API_KEY: ${CAPTURE_API_KEY:-}
    volumes:
      - captures-data:/app/data

volumes:
  captures-data:
